# Santos10 UCM2 HiFi — single proven product route.
# Physically proven #2 state, speaker direct-only: explicit loopback-off
# (golden static 0x36=0x03/0x2d=0x00; direct DAC1 path + HP preserved): Mixer 3 / Speaker 61 / Boost 4 /
# Headphone 45 / DAC1 96 / AIF1DAC1 96. No longer under investigation.
# No numeric numids, no raw registers, no jack/profile complexity.

SectionVerb {

	EnableSequence [

		cset "name='Speaker Mixer Volume' 3,3"
		cset "name='Speaker Volume' 61,61"
		cset "name='Speaker Boost Volume' 4,4"
		cset "name='Headphone Volume' 45,45"
		cset "name='DAC1 Volume' 96,96"
		cset "name='AIF1DAC1 Volume' 96,96"
		cset "name='AIF1DAC1 EQ Switch' off"
		cset "name='AIF2 EQ Switch' off"

		cset "name='Speaker Switch' on"
		cset "name='Headphone Switch' on"
		cset "name='DAC1 Switch' on"
		cset "name='Left Output Mixer DAC Switch' off"
		cset "name='Right Output Mixer DAC Switch' off"
		cset "name='DAC1L Mixer AIF1.1 Switch' on"
		cset "name='DAC1R Mixer AIF1.1 Switch' on"
		cset "name='Left Headphone Mux' DAC"
		cset "name='Right Headphone Mux' DAC"
		cset "name='SPKL Output Switch' off"
		cset "name='SPKL DAC1 Switch' on"
		cset "name='SPKR Output Switch' off"
		cset "name='SPKR DAC1 Switch' on"
		cset "name='SPKL Boost SPKL Switch' on"
		cset "name='SPKR Boost SPKR Switch' on"
	]
}

SectionDevice."Speaker" {
	Comment "Santos10 Speaker/Headphone HiFi"

	Value {
		PlaybackPriority 100
		PlaybackPCM "hw:${CardId}"
	}
}
